<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    >
    <title>ChiikawaSirenBattle</title>
    <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

    <style>
        :root {
            --game-width: 640;
            --game-height: 480;
            --panel-gap: 14px;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #111;
            overscroll-behavior: none;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #app {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--panel-gap);
            padding:
                max(8px, env(safe-area-inset-top))
                max(8px, env(safe-area-inset-right))
                max(8px, env(safe-area-inset-bottom))
                max(8px, env(safe-area-inset-left));
        }

        #game-wrap {
            position: relative;
            flex: 0 0 auto;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 640px;
            height: 480px;
            outline: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none;
        }

        #status {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: sans-serif;
            font-size: 14px;
            pointer-events: none;
        }

        /*
         * スマホ縦持ち時だけ表示する、画面外の大型操作パネル。
         * Godotの640x480には食い込ませず、ブラウザの余白を使う。
         */
        #mobile-controller {
            display: none;
            width: min(94vw, 620px);
            flex: 0 0 auto;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            box-sizing: border-box;
        }

        #mobile-controller.is-visible {
            display: grid;
        }

        .mobile-control-button {
            min-height: 72px;
            border: 2px solid rgba(255, 255, 255, 0.88);
            border-radius: 12px;
            background: rgba(25, 25, 25, 0.96);
            color: white;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            font-size: 24px;
            font-weight: 700;
            line-height: 1;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            cursor: pointer;
        }

        .mobile-control-button.is-pressed {
            background: rgba(90, 90, 90, 0.98);
            transform: translateY(1px);
        }

        @media (orientation: landscape) {
            /*
             * 横持ちはゲーム画面自体が大きく取れるため、
             * いったんコントローラーを隠す。
             */
            #mobile-controller.is-visible {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="game-wrap">
            <canvas id="canvas" width="640" height="480">
                Your browser does not support the canvas tag.
            </canvas>
            <div id="status">Loading...</div>
        </div>

        <div id="mobile-controller" aria-label="ゲーム操作">
            <button
                type="button"
                class="mobile-control-button"
                data-action="up"
                aria-label="上"
            >↑</button>

            <button
                type="button"
                class="mobile-control-button"
                data-action="accept"
                aria-label="決定"
            >決定</button>

            <button
                type="button"
                class="mobile-control-button"
                data-action="down"
                aria-label="下"
            >↓</button>

            <button
                type="button"
                class="mobile-control-button"
                data-action="back"
                aria-label="もどる"
            >もどる</button>
        </div>
    </div>

    <script src="index.js"></script>
    <script>
        const BASE_WIDTH = 640;
        const BASE_HEIGHT = 480;

        const app = document.getElementById("app");
        const wrap = document.getElementById("game-wrap");
        const canvas = document.getElementById("canvas");
        const status = document.getElementById("status");
        const controller = document.getElementById("mobile-controller");

        let godotWantsController = false;

        function isCoarseTouchDevice() {
            return (
                navigator.maxTouchPoints > 0
                || window.matchMedia("(pointer: coarse)").matches
            );
        }

        function shouldShowController() {
            return (
                godotWantsController
                && isCoarseTouchDevice()
                && window.innerHeight > window.innerWidth
            );
        }

        window.chiikawaSetControllerVisible = function(visible) {
            godotWantsController = !!visible;
            updateLayout();
        };

        function updateLayout() {
            const showController = shouldShowController();

            controller.classList.toggle(
                "is-visible",
                showController
            );

            const horizontalPadding = 16;
            const verticalPadding = 20;
            const gap = showController ? 14 : 0;

            const controllerHeight = showController
                ? Math.min(168, Math.max(144, window.innerHeight * 0.20))
                : 0;

            const availableWidth = Math.max(
                1,
                window.innerWidth - horizontalPadding
            );

            const availableHeight = Math.max(
                1,
                window.innerHeight
                - verticalPadding
                - controllerHeight
                - gap
            );

            const fitScale = Math.min(
                availableWidth / BASE_WIDTH,
                availableHeight / BASE_HEIGHT
            );

            /*
             * PCでは整数倍を優先。
             * スマホ縦持ちは画面に収めるため小数倍率で縮小。
             */
            let scale;
            if (!isCoarseTouchDevice() && fitScale >= 1.0) {
                scale = Math.max(1, Math.floor(fitScale));
            } else {
                scale = fitScale;
            }

            scale = Math.max(0.1, scale);

            const cssWidth = Math.round(BASE_WIDTH * scale);
            const cssHeight = Math.round(BASE_HEIGHT * scale);

            wrap.style.width = `${cssWidth}px`;
            wrap.style.height = `${cssHeight}px`;

            canvas.style.width = `${cssWidth}px`;
            canvas.style.height = `${cssHeight}px`;
        }

        function fireMobileAction(action) {
            /*
             * GodotのJavaScriptBridge callbackはブラウザ上で
             * typeof === "function" と判定されない環境があるため、
             * truthyかどうかだけで確認して直接呼ぶ。
             */
            if (window.chiikawaGodotInput) {
                window.chiikawaGodotInput(action);
            }
        }

        document.querySelectorAll(
            ".mobile-control-button"
        ).forEach((button) => {
            const action = button.dataset.action;

            const press = (event) => {
                event.preventDefault();
                event.stopPropagation();

                button.classList.add("is-pressed");
                fireMobileAction(action);
            };

            const release = (event) => {
                if (event) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                button.classList.remove("is-pressed");
            };

            /*
             * click待ちではなくpointerdownで即反応させる。
             * 「タップしてから反応するまで遅い」を軽減する。
             */
            button.addEventListener(
                "pointerdown",
                press,
                { passive: false }
            );
            button.addEventListener(
                "pointerup",
                release,
                { passive: false }
            );
            button.addEventListener(
                "pointercancel",
                release,
                { passive: false }
            );
            button.addEventListener(
                "pointerleave",
                release,
                { passive: false }
            );
            button.addEventListener(
                "contextmenu",
                (event) => event.preventDefault()
            );
        });

        window.addEventListener("resize", updateLayout);
        window.addEventListener(
            "orientationchange",
            () => setTimeout(updateLayout, 80)
        );

        updateLayout();

        const engine = new Engine({"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":30864260,"index.wasm":37900721},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});

        engine.startGame({
            canvas: canvas,
            canvasResizePolicy: 0,
            onProgress: function(current, total) {
                if (!status) {
                    return;
                }

                if (total > 0) {
                    const percent = Math.floor(
                        (current / total) * 100
                    );
                    status.textContent = `Loading... ${percent}%`;
                } else {
                    status.textContent = "Loading...";
                }
            },
            onPrintError: function(text) {
                console.error(text);
            }
        }).then(function() {
            status.style.display = "none";
            updateLayout();
        }).catch(function(error) {
            status.textContent = "Load error";
            console.error(error);
        });
    </script>
</body>
</html>
