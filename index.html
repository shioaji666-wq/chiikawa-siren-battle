<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ChiikawaSirenBattle</title>
    <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #111;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }

        #game-wrap {
            position: relative;
            width: 640px;
            height: 480px;
            flex: 0 0 auto;
            transform-origin: center center;
        }

        #canvas {
            display: block;
            width: 640px;
            height: 480px;
            outline: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #status {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: sans-serif;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-wrap">
        <canvas id="canvas" width="640" height="480">
            Your browser does not support the canvas tag.
        </canvas>
        <div id="status">Loading...</div>
    </div>

    <script src="index.js"></script>
    <script>
        const BASE_WIDTH = 640;
        const BASE_HEIGHT = 480;

        const wrap = document.getElementById("game-wrap");
        const canvas = document.getElementById("canvas");
        const status = document.getElementById("status");

        function updateGameScale() {
            const availableWidth = window.innerWidth;
            const availableHeight = window.innerHeight;
            const fitScale = Math.min(
                availableWidth / BASE_WIDTH,
                availableHeight / BASE_HEIGHT
            );

            // 640x480以上の表示領域なら整数倍のみ。
            // 小さいスマホ画面では収まるように縮小だけ小数倍率を許可する。
            let scale;
            if (fitScale >= 1.0) {
                scale = Math.max(1, Math.floor(fitScale));
            } else {
                scale = fitScale;
            }

            wrap.style.transform = `scale(${scale})`;
        }

        window.addEventListener("resize", updateGameScale);
        window.addEventListener("orientationchange", updateGameScale);
        updateGameScale();

        const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":30861444,"index.wasm":37900721},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});

        engine.startGame({
            canvas: canvas,
            canvasResizePolicy: 0,
            onProgress: function(current, total) {
                if (!status) return;

                if (total > 0) {
                    const percent = Math.floor((current / total) * 100);
                    status.textContent = `Loading... ${percent}%`;
                } else {
                    status.textContent = "Loading...";
                }
            },
            onPrintError: function(text) {
                console.error(text);
            }
        }).then(function() {
            status.style.display = "none";
            updateGameScale();
        }).catch(function(error) {
            status.textContent = "Load error";
            console.error(error);
        });
    </script>
</body>
</html>
