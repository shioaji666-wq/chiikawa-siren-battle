<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >
    <title>ChiikawaSirenBattle</title>
    <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

    <style>
        :root {
            --game-width: 640;
            --game-height: 480;
            --panel-gap: 14px;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #111;
            overscroll-behavior: none;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #app {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--panel-gap);
            padding:
                max(8px, env(safe-area-inset-top))
                max(8px, env(safe-area-inset-right))
                max(8px, env(safe-area-inset-bottom))
                max(8px, env(safe-area-inset-left));
        }

        #game-wrap {
            position: relative;
            flex: 0 0 auto;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 640px;
            height: 480px;
            outline: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none;
        }

        #status {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: sans-serif;
            font-size: 14px;
            pointer-events: none;
        }

        /*
         * スマホ縦持ち時だけ表示する、画面外の大型操作パネル。
         * Godotの640x480には食い込ませず、ブラウザの余白を使う。
         */
        #mobile-controller {
            display: none;
            width: min(94vw, 620px);
            flex: 0 0 auto;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            box-sizing: border-box;
        }

        #mobile-controller.is-visible {
            display: grid;
        }

        .mobile-control-button {
            min-height: 72px;
            border: 2px solid rgba(255, 255, 255, 0.88);
            border-radius: 12px;
            background: rgba(25, 25, 25, 0.96);
            color: white;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            font-size: 24px;
            font-weight: 700;
            line-height: 1;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            cursor: pointer;
        }

        .mobile-control-button.is-pressed {
            background: rgba(90, 90, 90, 0.98);
            transform: translateY(1px);
        }

        @media (orientation: landscape) {
            /*
             * 横持ちはゲーム画面自体が大きく取れるため、
             * いったんコントローラーを隠す。
             */
            #mobile-controller.is-visible {
                display: none;
            }
        }
    </style>

    <script>
      // GitHub Pages stale-build guard.
      // GAME_VERSION is only the user-visible version. BUILD_ID changes on every web deployment,
      // even when GAME_VERSION stays the same. Cache Storage / Service Workers are cleared only
      // when a newer build is detected. IndexedDB (Godot user:// save) is intentionally preserved.
      (function chiikawaInstallLatestBuildGuard(){
        const GAME_VERSION = "2.0";
        const BUILD_ID = "20260903-v23-dev44-webguard";
        window.CHIikawaBuildId = BUILD_ID;
        const EMBEDDED_BUILD_TOKEN = GAME_VERSION + "|" + BUILD_ID;
        let checking = false;
        let lastCheckAt = 0;

        async function fetchLatestBuildToken() {
          const separator = location.search ? "&" : "?";
          const url = "version.txt?t=" + Date.now();
          const res = await fetch(url, {
            cache: "no-store",
            headers: { "Cache-Control": "no-cache" }
          });
          if (!res.ok) return "";
          return (await res.text()).trim();
        }

        async function clearWebRuntimeCachesPreservingSave() {
          // Cache Storage is safe to clear: Godot Web user:// is stored in IndexedDB, not Cache Storage.
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map(key => caches.delete(key)));
          }
          if ("serviceWorker" in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(reg => reg.unregister()));
          }
        }

        async function checkForLatestBuild(force) {
          const now = Date.now();
          if (checking) return;
          if (!force && now - lastCheckAt < 5000) return;
          checking = true;
          lastCheckAt = now;
          try {
            const latest = await fetchLatestBuildToken();
            if (!latest || latest === EMBEDDED_BUILD_TOKEN) {
              sessionStorage.removeItem("chiikawa-build-reload-target");
              return;
            }

            // Safety guard: a stale cached HTML may keep reporting an older embedded token even
            // after a cache-busting reload. Never reload endlessly for the same target build.
            const reloadKey = "chiikawa-build-reload-target";
            const previousTarget = sessionStorage.getItem(reloadKey) || "";
            if (previousTarget === latest) {
              console.warn(
                "Latest-build guard stopped a reload loop. embedded=",
                EMBEDDED_BUILD_TOKEN,
                "latest=",
                latest
              );
              return;
            }
            sessionStorage.setItem(reloadKey, latest);

            await clearWebRuntimeCachesPreservingSave();

            const u = new URL(location.href);
            u.searchParams.set("build", latest.replace(/[^0-9A-Za-z._-]/g, "-"));
            u.searchParams.set("refresh", String(Date.now()));
            location.replace(u.toString());
          } catch (e) {
            console.warn("latest build check skipped", e);
          } finally {
            checking = false;
          }
        }

        // Initial load, browser back/forward restoration, tab reuse, and returning to an open tab.
        checkForLatestBuild(true);
        window.addEventListener("pageshow", () => checkForLatestBuild(true));
        window.addEventListener("focus", () => checkForLatestBuild(false));
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) checkForLatestBuild(false);
        });

        // Also catches a tab that is simply left open while a new build is deployed.
        window.setInterval(() => checkForLatestBuild(false), 60000);
      })();
    </script>
</head>
<body>
    <div id="app">
        <div id="game-wrap">
            <canvas id="canvas" width="640" height="480">
                Your browser does not support the canvas tag.
            </canvas>
            <div id="status">Loading...</div>
        </div>

        <div id="mobile-controller" aria-label="ゲーム操作">
            <button
                type="button"
                class="mobile-control-button"
                data-action="up"
                aria-label="上"
            >↑</button>

            <button
                type="button"
                class="mobile-control-button"
                data-action="accept"
                aria-label="決定"
            >決定</button>

            <button
                type="button"
                class="mobile-control-button"
                data-action="down"
                aria-label="下"
            >↓</button>

            <button
                type="button"
                class="mobile-control-button"
                data-action="back"
                aria-label="もどる"
            >もどる</button>
        </div>
    </div>

    <script src="index.js?build=20260827-v14-r5"></script>
    <script>
        const BASE_WIDTH = 640;
        const BASE_HEIGHT = 480;

        const app = document.getElementById("app");
        const wrap = document.getElementById("game-wrap");
        const canvas = document.getElementById("canvas");
        const status = document.getElementById("status");
        const controller = document.getElementById("mobile-controller");

        let godotWantsController = false;

        function isLikelyMobileDevice() {
            const ua = navigator.userAgent || "";
            const platform = navigator.platform || "";

            const mobileUa = /iPhone|iPod|Android|Mobile|IEMobile|Opera Mini/i.test(ua);

            // iPadOSはデスクトップ系UAを返すことがあるため、
            // Mac系platform + 複数タッチでもモバイル扱いにする。
            const iPadLike = (
                /MacIntel/i.test(platform)
                && navigator.maxTouchPoints > 1
            );

            const coarsePointer = window.matchMedia("(pointer: coarse)").matches;
            const hasTouch = navigator.maxTouchPoints > 0;

            return (
                mobileUa
                || iPadLike
                || coarsePointer
                || hasTouch
            );
        }

        function shouldShowController() {
            return (
                godotWantsController
                && isLikelyMobileDevice()
                && window.innerHeight > window.innerWidth
            );
        }

        window.chiikawaSetControllerVisible = function(visible) {
            godotWantsController = !!visible;
            updateLayout();
        };

        function updateLayout() {
            const showController = shouldShowController();

            controller.classList.toggle(
                "is-visible",
                showController
            );

            const horizontalPadding = 16;
            const verticalPadding = 20;
            const gap = showController ? 14 : 0;

            const controllerHeight = showController
                ? Math.min(168, Math.max(144, window.innerHeight * 0.20))
                : 0;

            const availableWidth = Math.max(
                1,
                window.innerWidth - horizontalPadding
            );

            const availableHeight = Math.max(
                1,
                window.innerHeight
                - verticalPadding
                - controllerHeight
                - gap
            );

            const fitScale = Math.min(
                availableWidth / BASE_WIDTH,
                availableHeight / BASE_HEIGHT
            );

            /*
             * PCでは整数倍を優先。
             * スマホ縦持ちは画面に収めるため小数倍率で縮小。
             */
            let scale;
            if (!isLikelyMobileDevice() && fitScale >= 1.0) {
                scale = Math.max(1, Math.floor(fitScale));
            } else {
                scale = fitScale;
            }

            scale = Math.max(0.1, scale);

            const cssWidth = Math.round(BASE_WIDTH * scale);
            const cssHeight = Math.round(BASE_HEIGHT * scale);

            wrap.style.width = `${cssWidth}px`;
            wrap.style.height = `${cssHeight}px`;

            canvas.style.width = `${cssWidth}px`;
            canvas.style.height = `${cssHeight}px`;
        }


        // iOS Safariのページズームを、canvas内外を問わずcapture段階で抑止する。
        // touchendだけではSafariがズームを先に確定する場合があるため、
        // 2回目のtouchstart自体を止める。通常の単発タップは通す。
        let lastTouchStartAt = 0;
        document.addEventListener("touchstart", (event) => {
            const now = Date.now();
            const isMultiTouch = event.touches && event.touches.length > 1;
            const isRapidSecondTap = !isMultiTouch && (now - lastTouchStartAt) <= 360;
            if (isMultiTouch || isRapidSecondTap) {
                event.preventDefault();
            }
            if (!isMultiTouch) {
                lastTouchStartAt = now;
            }
        }, { passive: false, capture: true });

        ["gesturestart", "gesturechange", "gestureend"].forEach((eventName) => {
            document.addEventListener(eventName, (event) => {
                event.preventDefault();
            }, { passive: false, capture: true });
        });

        document.addEventListener("touchmove", (event) => {
            if (event.touches && event.touches.length > 1) {
                event.preventDefault();
            }
        }, { passive: false, capture: true });

        let lastTouchEndAt = 0;
        document.addEventListener("touchend", (event) => {
            const now = Date.now();
            if (now - lastTouchEndAt <= 360) {
                event.preventDefault();
            }
            lastTouchEndAt = now;
        }, { passive: false, capture: true });

        document.addEventListener("dblclick", (event) => {
            event.preventDefault();
            event.stopPropagation();
        }, { passive: false, capture: true });

        window.chiikawaPickSaveFile = function() {
            const input = document.createElement("input");
            input.type = "file";
            input.accept = ".json,application/json";
            input.style.display = "none";

            input.addEventListener("change", () => {
                const file = input.files && input.files[0];
                if (!file) {
                    input.remove();
                    return;
                }

                const reader = new FileReader();
                reader.onload = () => {
                    if (window.chiikawaGodotSaveImport) {
                        window.chiikawaGodotSaveImport(
                            file.name,
                            String(reader.result || "")
                        );
                    }
                    input.remove();
                };
                reader.onerror = () => input.remove();
                reader.readAsText(file, "utf-8");
            }, { once: true });

            document.body.appendChild(input);
            input.click();
        };

        function fireMobileAction(action) {
            /*
             * GodotのJavaScriptBridge callbackはブラウザ上で
             * typeof === "function" と判定されない環境があるため、
             * truthyかどうかだけで確認して直接呼ぶ。
             */
            if (window.chiikawaGodotInput) {
                window.chiikawaGodotInput(action);
            }
        }

        document.querySelectorAll(
            ".mobile-control-button"
        ).forEach((button) => {
            const action = button.dataset.action;

            const press = (event) => {
                event.preventDefault();
                event.stopPropagation();

                button.classList.add("is-pressed");
                fireMobileAction(action);
            };

            const release = (event) => {
                if (event) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                button.classList.remove("is-pressed");
            };

            /*
             * click待ちではなくpointerdownで即反応させる。
             * 「タップしてから反応するまで遅い」を軽減する。
             */
            button.addEventListener(
                "pointerdown",
                press,
                { passive: false }
            );
            button.addEventListener(
                "pointerup",
                release,
                { passive: false }
            );
            button.addEventListener(
                "pointercancel",
                release,
                { passive: false }
            );
            button.addEventListener(
                "pointerleave",
                release,
                { passive: false }
            );
            button.addEventListener(
                "contextmenu",
                (event) => event.preventDefault()
            );
        });

        window.addEventListener("resize", updateLayout);
        window.addEventListener(
            "orientationchange",
            () => setTimeout(updateLayout, 80)
        );

        updateLayout();

        // GitHub Pages/browser HTTP cache guard for Godot runtime assets.
        // Cache Storage and Service Worker are cleared above, but the browser's normal HTTP
        // cache cannot be programmatically cleared. Give each Godot runtime fetch a build-specific
        // URL. The same build is cached locally; a new deployment uses a different URL.
        (function chiikawaInstallGodotAssetCacheBuster(){
            const BUILD_ID = String(window.CHIikawaBuildId || "20260903-v23-dev44-webguard");
            const nativeFetch = window.fetch.bind(window);
            const assetPattern = /\.(?:wasm|pck|js|zip|data)(?:$|[?#])/i;

            window.fetch = function(input, init) {
                try {
                    const rawUrl = (typeof input === "string")
                        ? input
                        : (input && input.url ? input.url : "");
                    if (rawUrl) {
                        const u = new URL(rawUrl, location.href);
                        if (u.origin === location.origin && assetPattern.test(u.pathname)) {
                            u.searchParams.set("build", BUILD_ID);
                            if (typeof input === "string") {
                                input = u.toString();
                            } else if (input instanceof Request) {
                                input = new Request(u.toString(), input);
                            }
                            // BUILD_ID is part of the URL, so the same build can safely reuse
                            // the browser cache. A new deployment gets a different URL automatically.
                            init = Object.assign({}, init || {}, { cache: "force-cache" });
                        }
                    }
                } catch (e) {
                    console.warn("Godot asset cache-buster skipped", e);
                }
                return nativeFetch(input, init);
            };
        })();

        const engine = new Engine({"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":31716516,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});

        engine.startGame({
            canvas: canvas,
            canvasResizePolicy: 0,
            onProgress: function(current, total) {
                if (!status) {
                    return;
                }

                if (total > 0) {
                    const percent = Math.floor(
                        (current / total) * 100
                    );
                    status.textContent = `Loading... ${percent}%`;
                } else {
                    status.textContent = "Loading...";
                }
            },
            onPrintError: function(text) {
                console.error(text);
            }
        }).then(function() {
            status.style.display = "none";
            updateLayout();
        }).catch(function(error) {
            status.textContent = "Load error";
            console.error(error);
        });
    </script>
</body>
</html>
